[project]
name = "poidem-backend"
version = "0.1.0"
description = "Backend MVP сервиса совместного посещения мероприятий «Пойдём?»"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.16,<2", "apscheduler>=3.11,<4", "asyncpg>=0.30,<1",
  "beautifulsoup4>=4.13,<5", "fastapi>=0.116,<1", "httpx>=0.28,<1",
  "lxml>=6,<7", "pydantic-settings>=2.10,<3", "sqlalchemy>=2.0.43,<3",
  "typer>=0.16,<1", "uvicorn[standard]>=0.35,<1"
]

[dependency-groups]
dev = ["aiosqlite>=0.21,<1", "pytest>=8.4,<9", "pytest-asyncio>=1.1,<2", "ruff>=0.12,<1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E9", "F", "I", "UP", "B"]
